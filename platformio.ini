; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-p4_r3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_unflags = -Os
build_flags = 
  -I./include
  ; -Ilib/lvgl/demos
  ; -Ilib
  ; -DLV_LVGL_H_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=5
  -O3
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DLCD_LVGL_DIRECT=0 ; single panel frame buffer, Display.drawBitmap() copies straight into it
  -DLCD_PIXEL_CLOCK_HZ=16000000 ; lower pixel clock (16 MHz, ~39 Hz refresh): avoids RGB panel underrun (image drifting sideways) while camera/JPEG/USB load PSRAM
  ; usb_host_uvc (lib/usb_host_uvc) Kconfig values
  -DCONFIG_UVC_INTERVAL_ARRAY_SIZE=3
  -DCONFIG_UVC_CHECK_PAYLOAD_HEADER_EOH=1
  -DCONFIG_UVC_CHECK_PAYLOAD_HEADER_ERR=1
build_src_filter =
  +<*>
  ; Force compile LVGL demo, remove when working on your own project
  ; +<C:\Users\sonth\GitHub\ATD5-P4-Test\lib\lvgl\demos>
monitor_filters = esp32_exception_decoder
monitor_eol = LF
board_build.partitions = partitions.csv
board_upload.flash_size = 32MB
; UVC cameras have a long configuration descriptor (> default 256 B).
; This makes pioarduino rebuild the ESP-IDF libs (Hybrid Compile) with a larger buffer.
custom_sdkconfig =
  CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE=4096
